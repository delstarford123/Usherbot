    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: transparent;
            
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .contact-container {
            text-align: center;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            width: 300px;
            align-self: center;
        }
        .contact-container h1 {
            margin-bottom: 20px;
            color: #444;
        }
        .contact-container a {
            display: block;
            margin: 10px 0;
            padding: 10px 15px;
            text-decoration: none;
            color: #fff;
            border-radius: 5px;
            font-size: 16px;
            transition: background-color 0.3s ease;
            align-self: self-start;
        }
        .contact-container a.whatsapp {
            background-color: #25D366;
        }
        .contact-container a.whatsapp:hover {
            background-color: #1da851;
        }
        .contact-container a.facebook {
            background-color: #1877F2;
        }
        .contact-container a.facebook:hover {
            background-color: #155dbb;
        }
    </style>
    <style>
        nav {

        }
        nav a {
           text-decoration: none;
           color: #333;
           margin: 0 15px;
           font-size: 18px;
        }
        nav a:hover {

     </style>
</head>
