<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Collection for UsherBot</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f9;
        }
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            text-align: center;
            margin: 10 auto;
            padding: 20px;
            background:transparent;
            border-radius: 8px;
            justify-content: center;
        }
        label {
            margin-top: 10px;
            font-weight: bold;
        }
        input, button {
            margin-top: 5px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #4008f8;
            color: white;
            cursor: pointer;
            font-size: larger;
            font-weight: bold;
        }
        button:hover {
            background-color: transparent;
        }
        .camera-section {
            margin-top: 20px;
        }
        .camera-view {
            align-content: center;
            position: relative;
            width: 100%;
            max-width: 500px;
            height: 700px; /* Full-body height */
            margin: 0 auto;
            border-radius: 8px;
            overflow: hidden;
            border: 5px solid #007BFF;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .capture-button {
            margin-top: 20px;
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #ffef0a;
            font-weight: bold;
        }
        .captured-image {
            margin-top: 20px;
        }
        .captured-image img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 8px;
            border: 2px solid #007BFF;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Data Collection for UsherBot</h1>
        <form id="dataForm">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="location">Location of Stay:</label>
            <input type="text" id="location" name="location" required>

            <label for="yearOfStudy">Year of Study:</label>
            <input type="number" id="yearOfStudy" name="yearOfStudy" required>

            <label for="registrationNumber">Registration Number:</label>
            <input type="text" id="registrationNumber" name="registrationNumber" required>

            <label for="phoneNumber">Phone Number:</label>
            <input type="tel" id="phoneNumber" name="phoneNumber" required>

            <div class="camera-section">
                <div class="camera-view">
                    <video id="video" autoplay></video>
                </div>
                <button type="button" class="capture-button" onclick="captureImage()">Capture Full-Body Image</button>
                <div class="captured-image">
                    <img id="capturedImage" alt="Full Body Image" />
                </div>
            </div>

            <button type="submit" style="width: 100%; height: 50px;">Submit</button>
        </form>
    </div>

    <script>
        const video = document.getElementById('video');
        const capturedImage = document.getElementById('capturedImage');

        // Access the device camera
        navigator.mediaDevices.getUserMedia({ video: { width: 500, height: 700 } }) // Full-body dimensions
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(error => {
                console.error("Error accessing the camera:", error);
                alert("Unable to access the camera. Please check your device settings.");
            });

        function captureImage() {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert the captured image to a data URL (base64)
            const imageData = canvas.toDataURL('image/png');
            console.log("Captured Full-Body Image Data:", imageData);

            // Display the captured image
            capturedImage.src = imageData;

            alert("Full-body image captured successfully!");
        }

        document.getElementById('dataForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert("Thank you, data submitted successfully!");
            // Placeholder for form submission logic
        });
    </script>
</body>
</html>
