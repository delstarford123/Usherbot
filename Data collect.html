        <h1>Data Collection for UsherBot</h1>
        <form style="align-content: center;" id="dataForm" >
            <label for="name" style="color: #1e07f2;">Full Name:</label>
            <input type="text" style="color: lime;" id="name" name="name" max="50" required>

            <label for="location"style="color: #1e07f2;">Location of Stay:</label>
            <input type="text"style="color: lime;" id="location" name="location" max="10" required>

            <label for="yearOfStudy" style="color: #1606f1;">Year of Study:</label>
            <input type="number" style="color: lime;" id="yearOfStudy" name="yearOfStudy" max="10" required>

            <label for="registrationNumber" style="color: #3702f5;" >Registration Number:</label>
            <input type="text" style="color: lime;" id="registrationNumber" name="registrationNumber" required>
            <label for="phoneNumber" style="color: #270aff;">Phone Number:</label>
            <input type="tel" style="color: lime;" id="phoneNumber" name="phoneNumber" required>

            
                <video id="video" autoplay ></video>
            </div>
            <button type="button" class="capture-button" onclick="captureImage('center')">Capture Center</button>
            <button type="button" class="capture-button" onclick="captureImage('left')">Capture Left</button>
            <button type="button" class="capture-button" onclick="captureImage('right')">Capture Right</button>
            <div class="captured-images">
                <img id="centerImage" alt="Center Face" />
                <img id="leftImage" alt="Left Face" />
                <img id="rightImage" alt="Right Face" />
            </div>
            </div>

            <button type="submit" style="width: 100%; height: 50px; padding: 50px;align-self: center;">Submit</button>
        </form>
        </div>

        <script>
        const video = document.getElementById('video');
        const centerImage = document.getElementById('centerImage');
        const leftImage = document.getElementById('leftImage');
        const rightImage = document.getElementById('rightImage');

        // Access the device camera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
            video.srcObject = stream;
            })
            .catch(error => {
            console.error("Error accessing the camera:", error);
            alert("Unable to access the camera. Please check your device settings.");
            });

        function captureImage(position) {
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            const context = canvas.getContext('2d');
            context.drawImage(video, 0, 0, canvas.width, canvas.height);

            // Convert the captured image to a data URL (base64)
            const imageData = canvas.toDataURL('image/png');
            console.log(`Captured ${position} Image Data:`, imageData);

            // Display the captured image in the corresponding placeholder
            if (position === 'center') {
            centerImage.src = imageData;
            } else if (position === 'left') {
            leftImage.src = imageData;
            } else if (position === 'right') {
            rightImage.src = imageData;
            }

            alert(`${position.charAt(0).toUpperCase() + position.slice(1)} image captured successfully!`);
        }

        document.getElementById('dataForm').addEventListener('submit', function(event) {
            event.preventDefault();
            alert("Thank you ,Data submitted successfully!");
            // Placeholder for form submission logic
        });
        </script>
